spring:
  application:
    name: expenseTrackerApi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensetracker}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  servlet:
    context-path: /api/v1
